name: Publish npm
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag and package version differ"; exit 1; }
          test "$(cat VERSION | tr -d '\r\n')" = "$VERSION" || { echo "VERSION and package.json differ"; exit 1; }
      - run: npm pack --dry-run
      - name: Publish with npm trusted publishing (OIDC)
        run: npm publish --access public
